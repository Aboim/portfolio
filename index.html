        const grid = document.getElementById('grid');
        const projCount = document.getElementById('projCount');
        const filters = document.getElementById('filters');

        function getTipoTag(tipo) {
            const map = { web: 'tag-web', desktop: 'tag-desktop', utility: 'tag-utility', mobile: 'tag-mobile', game: 'tag-game' };
            return map[tipo] || 'tag-web';
        }

        function getTipoLabel(tipo) {
            const map = { web: 'Web', desktop: 'Desktop', utility: 'Utilitario', mobile: 'Mobile', game: 'Jogo' };
            return map[tipo] || tipo;
        }

        function renderCards(filter) {
            const filtrados = filter === 'todos'
                ? projectos
                : projectos.filter(p => p.tipo === filter || p.tags.includes(filter));

            projCount.textContent = `(${filtrados.length})`;
            grid.innerHTML = '';

            filtrados.forEach((p, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${i * 50}ms`;

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-icon" style="background:${p.cor}22; color:${p.cor}">${p.icone}</div>
                        <div class="card-info">
                            <h3>${p.nome}</h3>
                            <div class="stack">${p.stack}</div>
                        </div>
                    </div>
                    <p>${p.descricao}</p>
                    <div class="card-footer">
                        <span class="tag ${getTipoTag(p.tipo)}">${getTipoLabel(p.tipo)}</span>
                        ${p.tags.filter(t => t !== p.tipo).map(t => `<span class="tag tag-${t === 'mobile' ? 'mobile' : t === 'web' ? 'web' : t === 'data' ? 'utility' : t === 'game' || t === 'ai' ? 'game' : t === 'fullstack' ? 'web' : 'desktop'}">${t}</span>`).join('')}
                    </div>
                    <div class="card-links">
                        <a href="${p.link}" target="_blank">GitHub</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        filters.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') {
                filters.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderCards(e.target.dataset.filter);
            }
        });

        renderCards('todos');

        async function pushAll() {
            const btn = document.getElementById('btnPush');
            const msg = document.getElementById('pushMsg');
            btn.textContent = 'A fazer push...';
            btn.style.pointerEvents = 'none';
            msg.style.display = 'none';

            try {
                const res = await fetch('/push', { method: 'POST' });
                const data = await res.json();
                if (data.ok) {
                    msg.innerHTML = 'Push concluido!';
                    msg.className = 'push-msg success';
                } else {
                    msg.innerHTML = '<pre>' + (data.stderr || data.stdout || 'Erro desconhecido') + '</pre>';
                    msg.className = 'push-msg error';
                }
            } catch (e) {
                msg.textContent = 'Erro: servidor nao encontrado. Corre python server.py primeiro.';
                msg.className = 'push-msg error';
            }
            msg.style.display = 'block';
            btn.textContent = 'Push All';
            btn.style.pointerEvents = 'auto';
        }
